{% extends "base.html" %}{% block title %}Chat{% endblock %}{% block body %}
<h1>Ask MailMate</h1>
<p class="muted">Try: "What is the PTO policy?" · "Summarize the vendor note."</p>
<div id="log"></div>
<form id="f"><input id="m" size="70" placeholder="ask anything…" autocomplete="off"><button>Send</button></form>
<script>
const log = document.getElementById('log');
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('m').value;
  document.getElementById('m').value = '';
  log.innerHTML += `<div class="u"><b>You:</b> ${message.replace(/</g,'&lt;')}</div>`;
  const r = await fetch('/api/chat', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({message})});
  const j = await r.json();
  let tools = (j.tools_used||[]).map(t=>`<span class="tool">🔧 ${t.tool} → ${JSON.stringify(t.args)}</span>`).join(' ');
  let think = (j.thinking||[]).map(t=>`<div class="t">${t.replace(/</g,'&lt;')}</div>`).join('');
  log.innerHTML += `<div class="a"><b>MailMate:</b> <pre>${j.reply.replace(/</g,'&lt;')}</pre>${tools}<details><summary>reasoning trace</summary>${think}</details></div>`;
});
</script>
{% endblock %}
